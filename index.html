function spr(rows, map) {
  let w = 0; for (const r of rows) w = Math.max(w, r.length);
  const c = mkCanvas(w, rows.length), x = c.getContext('2d');
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let i = 0; i < r.length; i++) {
      let ch = r[i];
      if (map && map[ch] !== undefined) ch = map[ch];
      if (ch === '.' || ch === ' ') continue;
      const col = PAL[ch]; if (!col) continue;
      x.fillStyle = col; x.fillRect(i, y, 1, 1);
    }
  }
  return c;
}
function flipH(src) { const c = mkCanvas(src.width, src.height), x = c.getContext('2d'); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c; }
function flipV(src) { const c = mkCanvas(src.width, src.height), x = c.getContext('2d'); x.translate(0, src.height); x.scale(1, -1); x.drawImage(src, 0, 0); return c; }
function tint(src, col, alpha) {
  const c = mkCanvas(src.width, src.height), x = c.getContext('2d');
  x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-atop'; x.globalAlpha = alpha == null ? 1 : alpha;
  x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); return c;
}
function scaled(src, w, h, cw, ch) { // nearest-neighbour resize, bottom-centred in a cw x ch canvas
  const c = mkCanvas(cw || w, ch || h), x = noSmooth(c.getContext('2d'));
  x.drawImage(src, ((cw || w) - w) >> 1, (ch || h) - h, w, h); return c;
}
function rotated(src, ang) {
  const s = Math.ceil(Math.hypot(src.width, src.height)) + 2;
  const c = mkCanvas(s, s), x = noSmooth(c.getContext('2d'));
  x.translate(s / 2, s / 2); x.rotate(ang); x.drawImage(src, -src.width / 2, -src.height / 2); return c;
}
function stack(parts, w) { // vertically stack arrays of rows
  const rows = []; for (const p of parts) for (const r of p) rows.push(r); return rows;

// input
// ---------------------------------------------------------------------
const input = { joy: { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 }, keys: {}, ext: null, x: 0, y: 0 };
function readInput() {
  let x = 0, y = 0;
  if (input.ext) { x = input.ext.x; y = input.ext.y; }
  else {
    const j = input.joy;
    if (j.active) {
      const dx = j.x - j.ox, dy = j.y - j.oy, dd = Math.hypot(dx, dy);
      if (dd > 1.5) { const m = Math.min(1, (dd - 1.5) / 12); x = dx / dd * m; y = dy / dd * m; }
    }
    const k = input.keys;
    const kx = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0);
    const ky = (k.ArrowDown || k.KeyS ? 1 : 0) - (k.ArrowUp || k.KeyW ? 1 : 0);
    if (kx || ky) { const l = Math.hypot(kx, ky); x = kx / l; y = ky / l; }
  }
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }

}

// combat

    for (const o of coins) { if (!o.active || o.state === 2) continue; const d = (o.x - x) ** 2 + (o.y - y) ** 2; if (d < bd) { bd = d; best = o; } }

// ---------------------------------------------------------------------
// hero
// ---------------------------------------------------------------------
function updateHero(dt) {

  moveCollide(h, h.vx * dt, h.vy * dt, 3, [8, WW - 8, 64, WH - 12]);
  const sp = Math.hypot(h.vx, h.vy);
  h.moving = sp > 8; if (h.moving) h.walkT += dt * (sp / cfg.speed) * 10;
  if (Math.abs(input.x) > 0.15 && h.swingT > h.swingDur) h.face = input.x > 0 ? 1 : -1;
  h.zy = h.y; if (h.bump > 0) h.bump -= dt * 4;
  h.cd -= dt; h.swingT += dt;
  if (h.cd <= 0 && heroAttack()) h.cd = CONFIG.weapons[h.weapon].cooldown;
  if (h.moving && Math.random() < dt * 8) P(h.x + rnd(-2, 2), h.y, rnd(-6, 6), rnd(-8, -2), 0.35, PAL['3'], 1, 0);

    if (dd > w.radius + e.r) continue;

    if (w.knock && !(w.id === 'hammer' && e.fly)) { const kk = w.knock * (1 - e.res) / (dd || 1); e.kx += dx * kk; e.ky += dy * kk; }

    const hc = w.id === 'glaive' ? PAL.d : w.id === 'hammer' ? PAL.h : PAL['6'];

function updateGoal() {
  const h = G.hero, g = G.goal, step = curStep();
  g.kind = 'none'; g.ref = null;
  // 1) affordable upgrade
  let pad = null;
  for (const p of G.pads) {
    if (!p.avail || !p.unlocked) continue;
    const need = p.price - p.paid; if (h.coins < need) continue;
    let pri = 0;
    if (p.kind === 'repair') pri = G.gate.hp < G.gate.max * 0.5 ? 3 : 0;
    else if ((p.kind === 'tower' && G.towers[p.t].level === 0 && step === p.t) || (p.kind === 'weapon' && step === 'weapon')) pri = 2;
    else if (!step) pri = 1;
    if (pri && (!pad || pri > pad.pri)) { pad = p; pad.pri = pri; }
  }
  if (pad) { g.kind = 'pad'; g.ref = pad; g.x = pad.px; g.y = pad.py; }
  // 2) enemies hitting the gates/crystal
  if (g.kind === 'none') {
    let best = null, bd = 1e9;
    for (const e of enemies) {
      if (!e.active || e.dying || (e.mode !== 1 && e.mode !== 4 && e.mode !== 3)) continue;
      const d = (e.x - h.x) ** 2 + (e.y - h.y) ** 2; if (d < bd) { bd = d; best = e; }
    }

  }
  // 3) gold on the ground
  if (g.kind === 'none') {
    let best = null, bs = 0;
    for (const c of coins) {
      if (!c.active || c.state === 2) continue;
      const d = Math.hypot(c.x - h.x, c.y - h.y), s = c.val / (1 + d / 50);
      if (s > bs) { bs = s; best = c; }
    }
    if (best) { g.kind = 'coin'; g.ref = best; g.x = best.x; g.y = best.y; }
  }
  // 4) any enemy, closest to the gates
  if (g.kind === 'none') {
    let best = null, bd = 1e9;
    for (const e of enemies) { if (!e.active || e.dying) continue; const d = (e.x - GATE.x) ** 2 + (e.y - GATE.y) ** 2; if (d < bd) { bd = d; best = e; } }
    if (best) { g.kind = 'enemy'; g.ref = best; g.x = best.x; g.y = best.y; }
  }
  // 5) next platform to save up for
  if (g.kind === 'none') {
    let nx = null;
    for (const p of G.pads) {
      if (!p.avail || !p.unlocked || p.kind === 'repair') continue;
      const main = (p.kind === 'tower' && G.towers[p.t].level === 0) || p.kind === 'weapon';
      if (!nx || (main && !nx.main)) { nx = p; nx.main = main; }
    }
    if (nx) { g.kind = 'next'; g.ref = nx; g.x = nx.px; g.y = nx.py; }
  }
  // hint
  let hint = 'DEFEND THE GATES!', col = PAL['6'];
  if (G.gate.hp <= 0) { hint = 'PROTECT THE CRYSTAL!'; col = PAL.j; }
  if (g.kind === 'pad') { hint = 'UPGRADE READY: ' + g.ref.label; col = PAL.e; }
  else if (G.gateHitT > 0 && G.gate.hp > 0) { hint = 'GATES ARE BREAKING!'; col = PAL.j; }
  else if (g.kind === 'coin') { hint = 'GRAB THE GOLD!'; col = PAL.e; }
  else if (g.kind === 'next' && G.wave.n > 1) { hint = 'NEXT: ' + g.ref.label; col = PAL.h; }
  else if (G.wave.phase === 'pause' && g.kind === 'none') { hint = 'GET READY!'; col = PAL.h; }
  if (G.victoryT >= 0 && g.kind !== 'pad' && G.gateHitT <= 0) { hint = 'THE KEEP IS SAFE!'; col = PAL.h; }
  if (hint !== G.hint) { G.hint = hint; G.hintColor = col; G.hintPop = 1; }
}

// main update
// ---------------------------------------------------------------------
function updateFxOnly(dt) {

  for (const n of nums) { if (!n.active) continue; n.t += dt; n.y -= (n.big ? 14 : 20) * dt * (1 - n.t); if (n.t > 0.75) n.active = false; }
  for (const f of fxs) { if (!f.active) continue; f.t += dt; if (f.kind === 'sword' || f.kind === 'axe' || f.kind === 'glaive' || f.kind === 'hammer') { f.x = G.hero.x; f.y = G.hero.y - 5; } if (f.t >= f.dur) f.active = false; }
  for (const f of flys) { if (!f.active) continue; f.t += dt / f.dur; if (f.t >= 1) { f.active = false; P(f.x1, f.y1 - 2, rnd(-15, 15), -20, 0.3, PAL.f, 1, 60, true); } }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 10 - G.shake * dt * 4);
  if (G.flash > 0) G.flash -= dt;
  G.banner.t += dt; if (G.hintPop > 0) G.hintPop -= dt * 4;
  if (G.hudPlus.t > 0) { G.hudPlus.t -= dt; if (G.hudPlus.t <= 0) G.hudPlus.v = 0; }
  if (G.gate.flash > 0) G.gate.flash -= dt; if (G.gate.scaffold > 0) G.gate.scaffold -= dt;
  if (G.crystal.flash > 0) G.crystal.flash -= dt;
}
function update(dt) {
  readInput();
  if (!G.tut.done) { G.tut.t += dt; if (Math.hypot(input.x, input.y) > 0.3) { G.tut.moveT += dt; if (G.tut.moveT > 0.25) G.tut.done = true; } }
  if (G.card) { G.cardT += dt; updateFxOnly(dt); return; }
  if (G.over) {
    G.defeatT += dt; updateFxOnly(dt);
    for (const e of enemies) if (e.active) { e.anim += dt; if (e.dying) { e.deathT += dt; if (e.deathT > 1.2) e.active = false; } }
    if (G.defeatT > 1.6 && !G.card) { G.card = { type: 'defeat' }; G.cardT = 0; adEvent('end'); }
    return;
  }
  G.t += dt; G.stats.time = G.t;
  if (G.gateHitT > 0) G.gateHitT -= dt;
  updateHero(dt);
  updateWaves(dt);
  updateEnemies(dt);
  updateTowers(dt);
  updateProjectiles(dt);
  updateCoins(dt);
  updatePads(dt);
  updateFxOnly(dt);
  G.goalT -= dt; if (G.goalT <= 0) { G.goalT = 0.2; updateGoal(); } else trackGoal();
  if (G.victoryT >= 0 && !G.victoryShown) {

  }

  const tx = G.hero.x - V.w / 2, ty = G.hero.y - V.h * 0.56;
  const k = Math.min(1, dt * CONFIG.view.camLerp);
  camT.x = tx; camT.y = ty; clampCam(camT);

}

    button(pxl + 18 + hw, ry + 36, hw, 15, 'REPLAY', PAL.l, 'replay', 1);
  } else {
    button(pxl + 12, ry + 36, bw, 15, 'TRY AGAIN', PAL.h, 'retry', 1);
  }
}

// ---------------------------------------------------------------------
// actions, CTA
// ---------------------------------------------------------------------
function ctaAllowed() { return G.tut.done || !!G.card; }

function storeUrl() { return /android/i.test(navigator.userAgent || '') ? CONFIG.storeUrls.android : CONFIG.storeUrls.ios; }

function cta() {
  if (!ctaAllowed()) return;
  G.ctaClicks++; AD.ctaCalls++;
  try {
    
    
    
    
    
    
    if (window.mraid && typeof mraid.open === 'function') mraid.open(storeUrl());
    else if (window.FbPlayableAd && typeof FbPlayableAd.onCTAClick === 'function') FbPlayableAd.onCTAClick();
    else if (window.ExitApi && typeof ExitApi.exit === 'function') ExitApi.exit();
    else if (typeof window.openAppStore === 'function') window.openAppStore();
    else if (typeof window.install === 'function') window.install();
    else window.open(storeUrl(), '_blank');
    
  } catch (e) { /* the container handles navigation */ }
}
// host lifecycle notifications (Mintegral needs gameReady / gameEnd / gameRetry)
function adEvent(name) {
  if (name === 'end') { if (AD.endSent) return; AD.endSent = true; }
  AD.events.push(name);
  
  try {
    if (name === 'ready' && typeof window.gameReady === 'function') window.gameReady();
    if (name === 'end' && typeof window.gameEnd === 'function') window.gameEnd();
    if (name === 'retry' && typeof window.gameRetry === 'function') window.gameRetry();
  } catch (e) { /* ignore */ }
  
}
function applyRun() {
  const run = AD.ready && AD.viewable && !document.hidden;
  AD.running = run; if (run) AD.started = true;
  if (!run) { input.keys = {}; input.joy.active = false; }
  if (Sfx.ctx) { try { if (run) { if (Sfx.ctx.state === 'suspended') Sfx.ctx.resume(); } else if (Sfx.ctx.state === 'running') Sfx.ctx.suspend(); } catch (e) { /* ignore */ } }
  last = performance.now();
}
function doAction(a) {
  Sfx.play('click');
  if (a === 'install' || a === 'cta') cta();
  else if (a === 'mute') Sfx.setMuted(!Sfx.muted);
  else if (a === 'keep') { G.card = null; }
  else if (a === 'replay' || a === 'retry') { resetGame(); AD.endSent = false; adEvent('retry'); }
}

// ---------------------------------------------------------------------
// input listeners
// ---------------------------------------------------------------------
function toBuf(e) { const r = cvs.getBoundingClientRect(); return { x: ((e.clientX - r.left) * V.dpr - V.ox) / V.scale, y: ((e.clientY - r.top) * V.dpr - V.oy) / V.scale }; }
cvs.addEventListener('pointerdown', (e) => {
  Sfx.init();
  const p = toBuf(e);
  for (let i = btnN - 1; i >= 0; i--) { const o = BTN[i]; if (p.x >= o.x && p.x <= o.x + o.w && p.y >= o.y && p.y <= o.y + o.h) { doAction(o.act); e.preventDefault(); return; } }
  if (G.card || !AD.running) return;
  const j = input.joy; j.active = true; j.id = e.pointerId; j.ox = p.x; j.oy = p.y; j.x = p.x; j.y = p.y;
  try { cvs.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  e.preventDefault();
});
cvs.addEventListener('pointermove', (e) => {
  const j = input.joy; if (!j.active || e.pointerId !== j.id) return;
  const p = toBuf(e); j.x = p.x; j.y = p.y;
  const dx = j.x - j.ox, dy = j.y - j.oy, d = Math.hypot(dx, dy), R = 16;
  if (d > R) { j.ox = j.x - dx / d * R; j.oy = j.y - dy / d * R; }
  e.preventDefault();
});
const endJoy = (e) => { const j = input.joy; if (j.active && e.pointerId === j.id) j.active = false; };
cvs.addEventListener('pointerup', endJoy); cvs.addEventListener('pointercancel', endJoy);
window.addEventListener('keydown', (e) => { Sfx.init(); if (!AD.running) return; input.keys[e.code] = true; if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault(); if (e.code === 'KeyM') Sfx.setMuted(!Sfx.muted); });
window.addEventListener('keyup', (e) => { input.keys[e.code] = false; });
window.addEventListener('blur', () => { input.keys = {}; input.joy.active = false; });
window.addEventListener('resize', () => resize());
document.addEventListener('visibilitychange', applyRun);

// ---------------------------------------------------------------------
// main loop
// ---------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0; if (dt > CONFIG.view.maxDt) dt = CONFIG.view.maxDt;
  if (document.hidden) return;
  if (!API.freeze && AD.running) update(dt);
  render();
}
const API = {
  get state() { return G; },
  config: CONFIG, input, enemies, coins, projs, view: V, cam, ad: AD,
  freeze: false,
  get audio() { return Sfx.ctx ? Sfx.ctx.state : 'none'; },
  step(dt, n) { n = n || 1; for (let i = 0; i < n; i++) update(dt); },
  render() { render(); },
  restart() { resetGame(); },
  setInput(x, y) { input.ext = x == null ? null : { x, y }; },
  action(a) { doAction(a); },
  buttons() { return BTN.slice(0, btnN).map((o) => ({ x: o.x, y: o.y, w: o.w, h: o.h, act: o.act })); },
  summary() {
    return {
      t: +G.t.toFixed(2), wave: G.wave.n, phase: G.wave.phase, coins: G.hero.coins, gate: Math.round(G.gate.hp), gateStage: G.gate.stage,
      crystal: Math.round(G.crystal.hp), weapon: CONFIG.weapons[G.hero.weapon].name, prog: G.prog,
      towers: Object.keys(G.towers).map((k) => k + ':' + G.towers[k].level).join(','),
      alive: aliveEnemies(), card: G.card ? G.card.type : null, hint: G.hint, goal: G.goal.kind, kills: G.stats.kills, gold: G.stats.gold
    };
  }
};
window.__game = API;
function boot() {
  buildSprites(); genWorld(); resetGame();
  requestAnimationFrame((t) => { last = t; frame(t); });
  adEvent('ready');
  
  // MRAID (AppLovin, Unity, ironSource, Liftoff): start after 'ready' and only while viewable
  const m = window.mraid;
  if (m && typeof m.getState === 'function') {
    AD.viewable = false;
    const onReady = () => {
      m.addEventListener('viewableChange', (v) => { AD.viewable = !!v; applyRun(); });
      AD.viewable = typeof m.isViewable === 'function' ? !!m.isViewable() : true;
      AD.ready = true; applyRun();
    };
    if (m.getState() === 'loading') m.addEventListener('ready', onReady); else onReady();
    return;
  }
  
  
  window.gameStart = () => { AD.viewable = true; applyRun(); };
  window.gameClose = () => { AD.viewable = false; applyRun(); };
  
  AD.ready = true; applyRun();
}
boot();

})();</script>
